name: Predict2U Fast Fixture Snapshot

on:
  schedule:
    - cron: "5 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predict2u-fixture-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Pull and publish seven-day fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Refresh SportyBet overlay first
        env:
          SPORTYBET_COUNTRY: "gh"
          SPORTYBET_TIMELINE: "192"
          APP_TIMEZONE: "Africa/Accra"
        run: node enrich-sportybet-odds.js
        continue-on-error: true

      - name: Pull every fixture by date safely
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          DAYS_BACK: "0"
          DAYS_FWD: ${{ secrets.DAYS_FWD }}
          FIXTURE_CONCURRENCY: "1"
          FIXTURE_REQUEST_GAP_MS: "13000"
          FIXTURE_RATE_LIMIT_WAIT_MS: "65000"
          FIXTURE_MAX_RETRIES: "2"
        run: node fetch-fixtures-snapshot.js

      - name: Hydrate any missing current dates from SportyBet
        run: node hydrate-fixtures-from-sportybet.js

      - name: Attach team-profile rates so picks can publish
        run: node enrich-fixtures-from-profiles.js

      - name: Verify fixture snapshot
        run: node verify-fixture-snapshot.js

      - name: Rebuild compact public data bundle
        run: node build-public-data.js

      - name: Refuse to publish an empty live window
        run: node assert-matches-present.js

      - name: Commit fixture feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Predict2U Fixture Snapshot Bot"
          git config user.email "actions@users.noreply.github.com"

          git add -f -- fixtures.js fixture-snapshot-report.json current-data.js data-meta.json sportybet-odds.js sportybet-odds-coverage.json
          if git diff --cached --quiet; then
            echo "Fixture snapshot already matches the repository."
            exit 0
          fi

          git commit -m "Refresh seven-day fixture snapshot"

          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            node hydrate-fixtures-from-sportybet.js
            node build-public-data.js
            node assert-matches-present.js
            git add -f -- fixtures.js fixture-snapshot-report.json current-data.js data-meta.json sportybet-odds.js sportybet-odds-coverage.json
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep $((attempt * 5))
          done

          echo "Could not publish fixture snapshot after three attempts."
          exit 1
